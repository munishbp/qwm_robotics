[project]
name = "swarm"
version = "0.1.0"
description = "Decentralized world model search for heterogeneous cooperative transport"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.9.0",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
